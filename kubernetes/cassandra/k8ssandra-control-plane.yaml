apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8ssandra-operator-control-plane
  namespace: argocd 
spec:
  project: default
  source:
    repoURL: https://github.com/k8ssandra/k8ssandra-operator.git
    targetRevision: v1.33.0 
    path: config/deployments/control-plane
    kustomize:
      # Enables server-side apply, matching your '--server-side' flag
      serverSideApply: true
  destination:
    server: https://kubernetes.default.svc
    namespace: k8ssandra-operator-system # Replace with your target namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Required for server-side apply when managing large/complex CRDs
      - ServerSideApply=true
